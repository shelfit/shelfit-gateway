Mutation:
  type: object
  config:
    fields:
      follow:
        type: "Boolean!"
        args:
          followedUserId: "Int!"
        resolve: '@=mutation("App\\GraphQL\\Mutation\\FollowMutation::follow", args)'
      unfollow:
        type: "Boolean!"
        args:
          unfollowedUserId: "Int!"
        resolve: '@=mutation("App\\GraphQL\\Mutation\\FollowMutation::unfollow", args)'
      createReadLogFromExistingBook:
        type: "ReadLog!"
        args:
          bookId: "Int!"
          readLogInput: "CreateReadLogInput!"
        resolve: '@=mutation("App\\GraphQL\\Mutation\\ReadLogMutation::createReadLogFromExistingBook", args)'
      createReadLogFromNewBook:
        type: "ReadLog!"
        args:
          book: "CreateBookInput!"
          readLogInput: "CreateReadLogInput!"
        resolve: '@=mutation("App\\GraphQL\\Mutation\\ReadLogMutation::createReadLogFromNewBook", args)'
      createReadLogPageUpdate:
        type: "ReadLog!"
        args:
          pageUpdateInput: "CreateReadLogPageUpdateInput!"
        resolve: '@=mutation("App\\GraphQL\\Mutation\\ReadLogMutation::createReadLogPageUpdate", args)'
      deleteReadLogPageUpdate:
        type: "Boolean!"
        args:
          pageUpdateId: "Int!"
        resolve: '@=mutation("App\\GraphQL\\Mutation\\ReadLogMutation::deleteReadLogPageUpdate", args)'
      updateReadLog:
        type: "ReadLog!"
        args:
          updateReadLogInput: "UpdateReadLogInput!"
        resolve: '@=mutation("App\\GraphQL\\Mutation\\ReadLogMutation::updateReadLog", args)'
      createTextPost:
        type: "FeedPost!"
        args:
          text: "String!"
        resolve: '@=mutation("App\\GraphQL\\Mutation\\FeedPostMutation::createTextPost", args)'
      updateTextPost:
        type: "FeedPost!"
        args:
          postId: "Int!"
          text: "String!"
        resolve: '@=mutation("App\\GraphQL\\Mutation\\FeedPostMutation::updateTextPost", args)'
      deleteFeedPost:
        type: "Boolean!"
        args:
          postId: "Int!"
        resolve: '@=mutation("App\\GraphQL\\Mutation\\FeedPostMutation::deleteFeedPost", args)'
      likePost:
        type: "FeedPostLike"
        args:
          feedPostId: "Int!"
        resolve: '@=mutation("App\\GraphQL\\Mutation\\FeedPostMutation::likePost", args)'
      unlikePost:
        type: "Boolean!"
        args:
          feedPostLikeId: "Int!"
        resolve: '@=mutation("App\\GraphQL\\Mutation\\FeedPostMutation::unlikePost", args)'
      createComment:
        type: "Comment!"
        args:
          createCommentInput: "CreateCommentInput!"
        resolve: '@=mutation("App\\GraphQL\\Mutation\\CommentMutation::createComment", args)'
      editComment:
        type: "Comment!"
        args:
          commentId: "Int!"
          text: "String!"
        resolve: '@=mutation("App\\GraphQL\\Mutation\\CommentMutation::editComment", args)'
      likeComment:
        type: "Comment!"
        args:
          commentId: "Int!"
        resolve: '@=mutation("App\\GraphQL\\Mutation\\CommentMutation::likeComment", args)'
      unlikeComment:
        type: "Comment!"
        args:
          commentId: "Int!"
        resolve: '@=mutation("App\\GraphQL\\Mutation\\CommentMutation::unlikeComment", args)'
