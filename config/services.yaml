parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    Redis:
      class: \Redis
      factory: ['Symfony\Component\Cache\Adapter\RedisAdapter', 'createConnection']
      arguments:
        - '%env(REDIS_URL)%'
        - { persistent: true }

    s3_client:
      class: Aws\S3\S3Client
      arguments:
        $args:
          version: 'latest'
          region: '%env(S3_REGION)%'
          endpoint: '%env(S3_BASE_URI)%'
          use_path_style_endpoint: true
          credentials:
            key: '%env(S3_ACCESS_KEY)%'
            secret: '%env(S3_SECRET_KEY)%'

    public_s3_client:
      class: Aws\S3\S3Client
      arguments:
        $args:
          version: 'latest'
          region: '%env(S3_REGION)%'
          endpoint: '%env(S3_PUBLIC_BASE_URI)%'
          use_path_style_endpoint: true
          credentials:
            key: '%env(S3_ACCESS_KEY)%'
            secret: '%env(S3_SECRET_KEY)%'

    Aws\S3\S3Client $s3Client: "@s3_client"
    Aws\S3\S3Client $publicS3Client: "@public_s3_client"

    App\Service\FileUploadService:
      arguments:
        $profilePicturesBucket: '%env(S3_PROFILE_PICTURES_BUCKET)%'
        $s3WebServeBaseUri: '%env(S3_WEB_SERVE_BASE_URI)%'

    App\Service\FileStorageService:
      arguments:
        $profilePicturesBucket: '%env(S3_PROFILE_PICTURES_BUCKET)%'
        $s3WebServeBaseUri: '%env(S3_WEB_SERVE_BASE_URI)%'
        $defaultProfilePictureUrl: '%env(DEFAULT_PROFILE_PICTURE_URL)%'

    App\Service\RegistrationService:
      arguments:
        $frontendBaseUri: '%env(FRONTEND_BASE_URI)%'
